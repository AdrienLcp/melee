name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Each push runs in a group of its own: GitHub cancels a run left waiting
  # behind another of its group, and mails every cancelled run. The event is
  # part of the key, or a deploy dispatched on the commit just pushed queues
  # behind that push's whole run before starting its own.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks no browser runs. Every job below starts at once: the run lasts
  # as long as the slowest of them, which is one e2e shard.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      - name: Build
        run: pnpm build

      # Each package's build type-checks it, but neither `e2e/` nor the root
      # `vitest.config.ts` (`tsconfig.root.json`) belongs to a package.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        run: |
          node -p "'Line coverage: ' + require('./coverage/coverage-summary.json').total.lines.pct + '%'" >> "$GITHUB_STEP_SUMMARY"

  # Each shard builds and starts a server of its own, so no room is shared
  # between two of them. `strip-rows` is one test per locale of about two and
  # a half minutes, which a shard by test count would pile onto one runner,
  # so it shards on its own.
  e2e:
    name: e2e (${{ matrix.specs }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { specs: journeys-and-layouts, shard: 1/4 }
          - { specs: journeys-and-layouts, shard: 2/4 }
          - { specs: journeys-and-layouts, shard: 3/4 }
          - { specs: journeys-and-layouts, shard: 4/4 }
          - { specs: strip-rows, shard: 1/2 }
          - { specs: strip-rows, shard: 2/2 }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm build

      - uses: ./.github/actions/install-chromium

      - name: Test end to end
        env:
          SPECS: ${{ matrix.specs == 'strip-rows' && 'strip-rows' || 'choice-fits dead-socket everyone-answers full-game' }}
          SHARD: ${{ matrix.shard }}
        run: |
          read -ra specs <<< "$SPECS"
          pnpm test:e2e "${specs[@]}" --shard="$SHARD"

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ strategy.job-index }}
          # `outputDir` is relative to the config, so the traces are under `e2e/`;
          # the root this once pointed at uploaded nothing.
          path: e2e/test-results
          retention-days: 7

  # A job of its own: Lantern reads the trace's CPU times, so a heavy step
  # running beside it on the same runner would move the scores.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - uses: ./.github/actions/install-chromium

      - name: Lighthouse
        run: pnpm lighthouse

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # One check standing for all of them, under the name
  # `deploy-production.yaml` looks a commit up by: a failed job above leaves
  # it skipped, never green.
  validate:
    needs: [checks, e2e, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Checks, every end-to-end shard and Lighthouse passed.'

  # Every green push lands on staging, a Worker and a set of rooms of its own
  # at staging.melee.adrienlcp.com, so a fix is tried on a phone before a
  # table sees it. Production is `deploy-production.yaml`, run by hand.
  deploy-staging:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.melee.adrienlcp.com
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm build

      # Deploys are not queued in a concurrency group: GitHub cancels, and mails,
      # a run left waiting there. An older commit skips its deploy instead.
      - name: Check this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is-head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.head.outputs.is-head == 'true'
        run: pnpm --filter @melee/server exec wrangler deploy --env staging --var "GIT_COMMIT:${GITHUB_SHA}" --var "GIT_COMMIT_EPOCH:$(git log -1 --format=%ct)"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
