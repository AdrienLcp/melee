name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Melee does not reach production until it replaces Taverla: a deploy is run
  # by hand, `gh workflow run ci.yaml --ref main`.
  workflow_dispatch:

concurrency:
  # Each push runs in a group of its own: GitHub cancels a run left waiting
  # behind another of its group, and mails every cancelled run. The event is
  # part of the key, or a deploy dispatched on the commit just pushed queues
  # behind that push's whole run before starting its own.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Runs take about 6 minutes with the Lighthouse gate: about three times
    # that, so a hung browser or server is cut off instead of burning the
    # 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` is `biome check --write`: it repairs the drift and exits 0,
      # so running it here would pass on exactly the code CI exists to reject.
      - name: Lint
        run: pnpm lint:ci

      - name: Spell
        run: pnpm spell

      - name: Build
        run: pnpm build

      # Each package's build type-checks it, but neither `e2e/` nor the root
      # `vitest.config.ts` (`tsconfig.root.json`) belongs to a package.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        run: |
          node -p "'Line coverage: ' + require('./coverage/coverage-summary.json').total.lines.pct + '%'" >> "$GITHUB_STEP_SUMMARY"

      # Only Chromium: the journeys assert behaviour, not rendering, and a
      # second engine would double the slowest step to re-check the same thing.
      #
      # `--with-deps` runs `apt-get update` over every source the runner image
      # carries, and one of them is Google's own Chrome repository — which
      # nothing here installs from, Playwright shipping the Chromium it drives.
      # Google publishes that index a piece at a time, so an update landing
      # between the pieces fails on a hash mismatch and takes the whole job with
      # it, for minutes or for hours. Dropping the source leaves the step
      # standing on Ubuntu's mirrors alone.
      #
      # Those mirrors stall now and then: apt waited one to three minutes on
      # each font package before trying the next mirror, and the step took 12
      # minutes instead of 20 seconds. A short timeout moves on at once.
      - name: Install Chromium
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google*
          echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-stalled-mirror
          pnpm exec playwright install --with-deps chromium

      - name: Test end to end
        run: pnpm test:e2e

      # Last, alone in this job: Lantern reads the trace's CPU times, so a heavy
      # step running beside it would move the scores.
      - name: Lighthouse
        run: pnpm lighthouse

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          # `outputDir` is relative to the config, so the traces are under `e2e/`;
          # the root this once pointed at uploaded nothing.
          path: e2e/test-results
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Only after `validate`, so a red run never reaches the room on the table. A
  # room in progress survives it: its Durable Object keeps its state across a
  # deploy, and the screens reconnect on their own.
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Deploys are not queued in a concurrency group: GitHub cancels, and mails,
      # a run left waiting there. An older commit skips its deploy instead.
      - name: Check this commit is still the head of main
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "is-head=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.head.outputs.is-head == 'true'
        run: pnpm --filter @melee/server exec wrangler deploy --var "GIT_COMMIT:${GITHUB_SHA}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # Workflows break at run time: a typo in an expression or a context passes
  # as plain YAML and only fails when the step is reached.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
