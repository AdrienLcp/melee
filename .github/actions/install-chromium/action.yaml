name: Install Chromium
description: Playwright's Chromium and the system packages it needs, past the runner's flaky apt sources.
runs:
  using: composite
  steps:
    # Only Chromium: the journeys assert behaviour, not rendering, and a
    # second engine would double the slowest jobs to re-check the same thing.
    #
    # `--with-deps` runs `apt-get update` over every source the runner image
    # carries, and one of them is Google's own Chrome repository — which
    # nothing here installs from, Playwright shipping the Chromium it drives.
    # Google publishes that index a piece at a time, so an update landing
    # between the pieces fails on a hash mismatch and takes the whole job with
    # it, for minutes or for hours. Dropping the source leaves the step
    # standing on Ubuntu's mirrors alone.
    #
    # Those mirrors stall now and then, or crawl: apt waited one to three
    # minutes on each font package before trying the next mirror, and with
    # eight jobs installing at once one of them met a mirror serving 86 kB/s
    # and spent four and a half minutes on 22 MB of fonts. A short timeout
    # moves on from a stall; the packages are kept in the Actions cache, and
    # apt installs a package it finds in its own archive without fetching it.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/chromium-debs
        key: chromium-debs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: chromium-debs-${{ runner.os }}-${{ runner.arch }}-

    - run: |
        sudo rm -f /etc/apt/sources.list.d/*google*
        echo 'Acquire::http::Timeout "15"; Acquire::https::Timeout "15"; Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-stalled-mirror
        echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-debs
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
        mkdir -p ~/.cache/chromium-debs
        sudo cp ~/.cache/chromium-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        pnpm exec playwright install --with-deps chromium
        cp /var/cache/apt/archives/*.deb ~/.cache/chromium-debs/ 2>/dev/null || true
      shell: bash
